name: CI and Release

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  release:
    types: [created]

jobs:
  build:
    name: Build - ${{ matrix.platform.os-name }}
    permissions:
      contents: write
    strategy:
      matrix:
        platform:
          - os-name: Linux-x86_64
            runs-on: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os-name: Linux-aarch64
            runs-on: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - os-name: macOS-x86_64
            runs-on: macos-15-intel
            target: x86_64-apple-darwin
          - os-name: macOS-aarch64
            runs-on: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --locked --release

      - name: Run tests
        run: cargo test --locked

      - name: Create release artifact
        if: github.event_name == 'release'
        run: |
          mkdir -p artifacts
          cd target/release

          # Find the git-sync binary (it might not have an extension on Unix)
          if [ -f git-sync ]; then
            chmod +x git-sync
            tar -czf ../../artifacts/git-sync-${{ matrix.platform.target }}.tar.gz git-sync
          elif [ -f git-sync.exe ]; then
            tar -czf ../../artifacts/git-sync-${{ matrix.platform.target }}.zip git-sync.exe
          fi

      - name: Upload artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: git-sync-${{ matrix.platform.target }}-release
          path: artifacts/

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          for file in git-sync-*; do
            if [ -f "$file" ]; then
              gh release upload ${{ github.event.release.tag_name }} "$file"
            fi
          done
